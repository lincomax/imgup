name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'imgup-icon.png'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.9.2"

      - name: Version
        run: echo "VERSION=1.$(( ${{ github.run_number }} + 36 ))" >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk imgup-${{ env.VERSION }}.apk

      - uses: actions/upload-artifact@v7
        with:
          name: imgup-APK
          path: imgup-${{ env.VERSION }}.apk

      - name: Publish release (direct APK download)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          body_path: release-notes.md
          files: imgup-${{ env.VERSION }}.apk
