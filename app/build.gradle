plugins {
    id 'com.android.application'
}

// Version follows the GitHub Actions build number, offset so the first build is 1.37
def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger() + 36

android {
    namespace 'com.imgup.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.imgup.app'
        minSdk 26
        targetSdk 34
        versionCode buildNumber
        versionName "1.${buildNumber}"
    }

    signingConfigs {
        release {
            storeFile rootProject.file('signing/release.jks')
            storePassword 'imgupapp'
            keyAlias 'imgup'
            keyPassword 'imgupapp'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}
